
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>AMIR ALI ARCADE</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#080d1b;color:white;
 font-family:Tahoma,Arial;
 overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:0;color:white}
#menu{
 width:100%;height:100dvh;overflow:auto;
 padding:20px;background:
 radial-gradient(circle at 50% 0,#343a82,#10172e 55%,#070b16);
}
.logo{text-align:center;padding:15px 0 25px}
.logo h1{font-size:30px;margin:5px;text-shadow:0 0 22px #9c7bff}
.logo p{color:#aebce8;font-size:12px}
.games{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;max-width:900px;margin:auto;
}
.card{
 min-height:145px;padding:15px;border-radius:18px;
 background:linear-gradient(145deg,#26376b,#111a32);
 border:1px solid #485b92;
 box-shadow:0 7px 18px #0005;
}
.card:active{transform:scale(.96)}
.card .emoji{font-size:39px}
.card h3{font-size:15px;margin:8px 0}
.card p{font-size:11px;color:#b7c5e9;margin:0}
#play{
 display:none;position:fixed;inset:0;
 height:100dvh;width:100%;
 background:#080d1b;
 flex-direction:column;
 padding-top:env(safe-area-inset-top);
 padding-bottom:env(safe-area-inset-bottom);
}
#top{
 height:54px;flex-shrink:0;
 display:flex;align-items:center;justify-content:space-between;
 padding:5px 8px;gap:6px;
 background:#141d39;border-bottom:1px solid #394a79;
}
#top strong{font-size:13px;text-align:center;flex:1}
.topbtn{
 padding:10px 11px;border-radius:10px;
 background:#354578;font-size:12px;
}
.exit{background:#b83757}
#canvasBox{
 flex:1;min-height:0;width:100%;
 display:flex;align-items:stretch;justify-content:center;
 overflow:hidden;
}
canvas{
 display:block;width:100%;height:100%;
 background:#101a34;
 touch-action:none!important;
 user-select:none;-webkit-user-select:none;
 -webkit-touch-callout:none;
}
#bottom{
 flex-shrink:0;min-height:37px;
 display:flex;align-items:center;justify-content:center;
 color:#c8d2f6;font-size:12px;
 padding:5px;
 background:#111a32;
}
#menuButton{
 display:block;margin:20px auto;
 padding:14px 25px;background:#6655ef;
 border-radius:13px;font-weight:bold;
}
@media(min-width:650px){
 .games{grid-template-columns:repeat(3,1fr)}
 #play{max-width:1000px;margin:auto;left:0;right:0}
}
</style>
</head>
<body>

<section id="menu">
 <div class="logo">
  <h1>🎮 AMIR ALI ARCADE</h1>
  <p>ULTIMATE 2D GAMING WORLD</p>
  <p>۱۰ بازی دوبعدی | کنترل لمسی | تمام صفحه</p>
 </div>
 <div class="games" id="games"></div>
</section>

<section id="play">
 <div id="top">
  <button class="topbtn exit" onclick="home()">🏠 منو</button>
  <strong id="gameTitle">GAME</strong>
  <button class="topbtn" onclick="restart()">🔄</button>
  <button class="topbtn" onclick="fullScreen()">⛶</button>
  <button class="topbtn exit" onclick="home()">✖ خروج</button>
 </div>
 <div id="canvasBox">
  <canvas id="c" width="600" height="700"></canvas>
 </div>
 <div id="bottom">برای کنترل، صفحه بازی را لمس کن</div>
</section>

<script>
const $=id=>document.getElementById(id);
const c=$("c"),ctx=c.getContext("2d");
const W=600,H=700;

const names=[
 ["🐦","Flappy Bird","لمس صفحه برای پرواز"],
 ["🐍","Snake","کشیدن انگشت برای تغییر جهت"],
 ["🏓","Pong","حرکت انگشت برای کنترل"],
 ["🧱","Breakout","حرکت انگشت برای کنترل توپ"],
 ["❌","Tic Tac Toe","لمس خانه ها"],
 ["🔢","2048","کشیدن انگشت در چهار جهت"],
 ["🧠","Memory Cards","لمس کارت ها"],
 ["🎵","Simon Game","تکرار ترتیب رنگ ها"],
 ["🏃","Jungle Runner","لمس برای پرش"],
 ["🏎️","Mini Racing","کشیدن انگشت برای تغییر مسیر"]
];

let game=0,s={},running=false,over=false;
let score=0,best={},raf=0,last=0;
let pointer=null,particles=[];
let simonTimer=null;

names.forEach((g,i)=>{
 let d=document.createElement("div");
 d.className="card";
 d.innerHTML=`<div class="emoji">${g[0]}</div>
 <h3>${g[1]}</h3><p>${g[2]}</p>`;
 d.addEventListener("click",()=>start(i));
 $("games").appendChild(d);
});

function rand(a,b){return Math.random()*(b-a)+a}
function bg(a="#17294c",b="#080d1b"){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,a);g.addColorStop(1,b);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function rect(x,y,w,h,color,r=7){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function txt(t,x,y,size=25,color="white"){
 ctx.fillStyle=color;
 ctx.font=`bold ${size}px Tahoma`;
 ctx.textAlign="center";ctx.fillText(t,x,y);
}
function add(n=1){
 score+=n;
 best[game]=Math.max(best[game]||0,score);
 $("bottom").textContent="امتیاز: "+score+" | رکورد: "+best[game];
}
function finish(msg="بازی تمام شد"){
 if(over)return;
 over=true;
 $("bottom").textContent=msg+" | برای شروع دوباره 🔄 را بزن";
}

function start(i){
 game=i;score=0;over=false;running=true;
 $("menu").style.display="none";
 $("play").style.display="flex";
 $("gameTitle").textContent=names[i][1];
 $("bottom").textContent=names[i][2];
 cancelAnimationFrame(raf);
 if(simonTimer)clearTimeout(simonTimer);
 init();
 last=0;
 raf=requestAnimationFrame(loop);
}

function home(){
 running=false;
 cancelAnimationFrame(raf);
 if(simonTimer)clearTimeout(simonTimer);
 pointer=null;
 $("play").style.display="none";
 $("menu").style.display="block";
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}

async function fullScreen(){
 try{
  if(!document.fullscreenElement){
   await document.documentElement.requestFullscreen();
  }else{
   await document.exitFullscreen();
  }
 }catch(e){
  $("bottom").textContent="تمام صفحه در این مرورگر پشتیبانی نمی شود";
 }
}

function restart(){
 if(!running)return;
 score=0;over=false;particles=[];
 if(simonTimer)clearTimeout(simonTimer);
 init();
 $("bottom").textContent=names[game][2];
}

function init(){
 s={};
 if(game===0)s={y:300,v:0,pipes:[],timer:0};
 if(game===1)s={body:[[15,15],[14,15],[13,15]],dir:[1,0],food:[21,10],timer:0};
 if(game===2)s={x:300,y:350,vx:5,vy:4,p:300,ai:300};
 if(game===3){
  s={x:300,bx:300,by:500,vx:4,vy:-5,bricks:[]};
  for(let r=0;r<6;r++)for(let j=0;j<9;j++){
   s.bricks.push({x:25+j*62,y:80+r*32,on:true,
    color:["#ff526c","#ffb84b","#47c9f0","#a76cff","#55dc94","#ff7bba"][r]});
  }
 }
 if(game===4)s={board:Array(9).fill(""),turn:"X",done:false};
 if(game===5){s={board:Array(16).fill(0)};spawn2048();spawn2048();}
 if(game===6){
  let a=["🍎","🍎","🚗","🚗","⭐","⭐","🐱","🐱","⚽","⚽","🍀","🍀","🌙","🌙","🍒","🍒"];
  a.sort(()=>Math.random()-.5);
  s={cards:a,open:[],matched:[],moves:0};
 }
 if(game===7)s={seq:[],step:0,waiting:false,active:-1};
 if(game===8)s={y:530,vy:0,obs:[],timer:0};
 if(game===9)s={lane:1,obs:[],timer:0,speed:6};
}

// دریافت مختصات واقعی انگشت روی Canvas
function point(e){
 let r=c.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)*W/r.width,
  y:(e.clientY-r.top)*H/r.height
 };
}

// تمام کنترل های لمسی از همین قسمت انجام می شوند
c.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(!running||over)return;
 c.setPointerCapture(e.pointerId);
 let p=point(e);
 pointer={id:e.pointerId,x:p.x,y:p.y,lastX:p.x,lastY:p.y};

 if(game===0)flap();
 if(game===2)s.p=p.y-55;
 if(game===3)s.x=p.x;
 if(game===4)tic(p.x,p.y);
 if(game===6)memory(p.x,p.y);
 if(game===7)simonClick(p.x,p.y);
 if(game===8)jump();
 if(game===9)changeLane(p.x);
},{passive:false});

c.addEventListener("pointermove",e=>{
 if(!pointer||pointer.id!==e.pointerId||!running||over)return;
 e.preventDefault();
 let p=point(e);

 if(game===2)s.p=Math.max(0,Math.min(H-110,p.y-55));
 if(game===3)s.x=Math.max(55,Math.min(545,p.x));
 if(game===9)changeLane(p.x);

 pointer.lastX=p.x;
 pointer.lastY=p.y;
},{passive:false});

c.addEventListener("pointerup",e=>{
 if(!pointer||pointer.id!==e.pointerId)return;
 e.preventDefault();

 let p=point(e);
 let dx=p.x-pointer.x;
 let dy=p.y-pointer.y;

 if(game===1){
  if(Math.abs(dx)+Math.abs(dy)>25){
   let d=Math.abs(dx)>Math.abs(dy)
   ?(dx>0?[1,0]:[-1,0])
   :(dy>0?[0,1]:[0,-1]);
   if(d[0]!==-s.dir[0]||d[1]!==-s.dir[1])s.dir=d;
  }
 }

 if(game===5){
  if(Math.abs(dx)+Math.abs(dy)>25)move2048(dx,dy);
 }

 pointer=null;
},{passive:false});

c.addEventListener("pointercancel",()=>pointer=null);

// صفحه کلید برای کامپیوتر
window.addEventListener("keydown",e=>{
 if(!running||over)return;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();

 if(e.key==="ArrowUp"||e.key===" ") {
  if(game===0)flap();
  if(game===8)jump();
  if(game===1)snakeDirection(0,-1);
 }
 if(e.key==="ArrowDown"&&game===1)snakeDirection(0,1);
 if(e.key==="ArrowLeft"&&game===1)snakeDirection(-1,0);
 if(e.key==="ArrowRight"&&game===1)snakeDirection(1,0);
 if(e.key==="ArrowLeft"&&game===9)changeLane((s.lane-1)*200+20);
 if(e.key==="ArrowRight"&&game===9)changeLane((s.lane+1)*200+250);
 if(e.key==="ArrowLeft"&&game===2)s.p-=35;
 if(e.key==="ArrowRight"&&game===2)s.p+=35;
});

function loop(t){
 if(!running)return;
 let dt=Math.min((t-last)/16.67||1,2);
 last=t;
 if(!over)update(dt);
 draw();
 raf=requestAnimationFrame(loop);
}
function update(dt){
 if(game===0)updateFlappy(dt);
 if(game===1)updateSnake(dt);
 if(game===2)updatePong(dt);
 if(game===3)updateBreakout(dt);
 if(game===8)updateRunner(dt);
 if(game===9)updateRacing(dt);
 updateParticles();
}

// 1. FLAPPY BIRD
function flap(){if(!over)s.v=-10}
function updateFlappy(dt){
 s.timer+=dt;
 s.v+=.38*dt;
 s.y+=s.v*dt;
 if(s.timer>95){
  s.timer=0;
  s.pipes.push({x:630,top:rand(120,340),gap:205,passed:false});
 }
 s.pipes.forEach(p=>{
  p.x-=4*dt;
  if(!p.passed&&p.x<120){p.passed=true;add();}
  if(120>p.x&&92<p.x+65&&(s.y<p.top||s.y>p.top+p.gap))finish();
 });
 s.pipes=s.pipes.filter(p=>p.x>-80);
 if(s.y<10||s.y>650)finish();
}
function drawFlappy(){
 bg("#39a8e9","#b5eaff");
 circle(500,100,42,"#fff1a5");
 for(let i=0;i<6;i++){
  let x=(i*150-Date.now()*.025%150);
  circle(x,160+i%2*25,25,"#ffffff77");
  circle(x+25,155+i%2*25,34,"#ffffff77");
 }
 s.pipes.forEach(p=>{
  let g=ctx.createLinearGradient(p.x,0,p.x+65,0);
  g.addColorStop(0,"#087c37");g.addColorStop(.5,"#4bed70");g.addColorStop(1,"#087c37");
  rect(p.x,0,65,p.top,g,4);
  rect(p.x-6,p.top-20,77,20,"#25bd50");
  rect(p.x,p.top+p.gap,65,700,g,4);
  rect(p.x-6,p.top+p.gap,77,20,"#25bd50");
 });
 rect(0,665,600,35,"#4ca64d");
 circle(120,s.y,19,"#ffda35");
 circle(126,s.y-6,6,"white");circle(128,s.y-6,2,"#222");
 rect(133,s.y,17,8,"#ff8c31",4);
 txt("FLAPPY BIRD",300,45,24,"#17436a");
}

// 2. SNAKE
function snakeDirection(x,y){
 if(x!==-s.dir[0]||y!==-s.dir[1])s.dir=[x,y];
}
function updateSnake(dt){
 s.timer+=dt;
 if(s.timer<7)return;
 s.timer=0;
 let h=s.body[0],n=[h[0]+s.dir[0],h[1]+s.dir[1]];
 if(n[0]<0||n[0]>=30||n[1]<0||n[1]>=35||
 s.body.some(p=>p[0]===n[0]&&p[1]===n[1])){
  finish("برخورد کردی");return;
 }
 s.body.unshift(n);
 if(n[0]===s.food[0]&&n[1]===s.food[1]){
  add(10);s.food=[Math.floor(rand(1,29)),Math.floor(rand(1,34))];
 }else s.body.pop();
}
function drawSnake(){
 bg("#061e23","#07121d");
 for(let x=0;x<30;x++)for(let y=0;y<35;y++)
  if((x+y)%2===0)rect(x*20,y*20,20,20,"#ffffff08",1);
 circle(s.food[0]*20+10,s.food[1]*20+10,9,"#ff4f66");
 s.body.forEach((p,i)=>rect(p[0]*20+2,p[1]*20+2,16,16,i?"#25d38c":"#b1ff64",5));
 txt("SNAKE",300,35,22);
}

// 3. PONG
function updatePong(dt){
 s.x+=s.vx*dt;s.y+=s.vy*dt;
 if(s.y<10||s.y>690)s.vy*=-1;
 s.ai+=(s.y-s.ai)*.045*dt;
 s.p=Math.max(0,Math.min(590,s.p));
 if(s.x<45&&s.y>s.p&&s.y<s.p+110){
  s.vx=Math.abs(s.vx)*1.05;s.vy+=(s.y-s.p-55)*.06;
 }
 if(s.x>555&&s.y>s.ai&&s.y<s.ai+110)s.vx=-Math.abs(s.vx);
 if(s.x<0)finish("حریف برنده شد");
 if(s.x>600){add();s.x=300;s.y=350;s.vx=-5;}
}
function drawPong(){
 bg("#101a3a","#070d1c");
 for(let y=0;y<700;y+=55)rect(298,y,4,28,"#ffffff44");
 rect(20,s.p,14,110,"#53e2ff");
 rect(566,s.ai,14,110,"#ff6eb8");
 circle(s.x,s.y,12,"white");
 txt("YOU",100,40,20,"#6deaff");
 txt("CPU",500,40,20,"#ff9dce");
}

// 4. BREAKOUT
function updateBreakout(dt){
 s.x=Math.max(55,Math.min(545,s.x));
 s.bx+=s.vx*dt;s.by+=s.vy*dt;
 if(s.bx<10||s.bx>590)s.vx*=-1;
 if(s.by<10)s.vy=Math.abs(s.vy);
 if(s.by>620&&s.bx>s.x-65&&s.bx<s.x+65){
  s.vy=-Math.abs(s.vy);
  s.vx+=(s.bx-s.x)*.06;
 }
 if(s.by>700){finish();return;}
 s.bricks.forEach(b=>{
  if(b.on&&s.bx>b.x&&s.bx<b.x+55&&s.by>b.y&&s.by<b.y+25){
   b.on=false;s.vy*=-1;add(5);particle(s.bx,s.by,b.color);
  }
 });
 if(s.bricks.every(b=>!b.on))finish("همه آجرها شکسته شدند!");
}
function drawBreakout(){
 bg("#19122f","#080d1c");
 s.bricks.forEach(b=>{if(b.on)rect(b.x,b.y,54,23,b.color,5)});
 rect(s.x-65,645,130,14,"#60e1ff",8);
 circle(s.bx,s.by,10,"#fff17a");
}

// 5. TIC TAC TOE
function tic(x,y){
 if(s.done)return;
 let i=Math.floor(y/230)*3+Math.floor(x/200);
 if(i<0||i>8||s.board[i])return;
 s.board[i]=s.turn;
 let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 if(lines.some(a=>a.every(k=>s.board[k]===s.turn))){
  s.done=true;finish(s.turn+" برنده شد!");return;
 }
 if(s.board.every(Boolean)){s.done=true;finish("مساوی");return}
 s.turn=s.turn==="X"?"O":"X";
}
function drawTic(){
 bg("#171533","#080d1b");
 for(let i=1;i<3;i++){
  rect(i*200-2,80,4,540,"#7886bb");
  rect(25,i*180+80,550,4,"#7886bb");
 }
 s.board.forEach((v,i)=>{
  let x=i%3*200+100,y=Math.floor(i/3)*230+185;
  if(v==="X")txt("X",x,y,95,"#ff7098");
  if(v==="O"){
   ctx.strokeStyle="#63dcff";ctx.lineWidth=11;
   ctx.beginPath();ctx.arc(x,y-25,42,0,Math.PI*2);ctx.stroke();
  }
 });
 txt("TIC TAC TOE",300,40,23);
}

// 6. 2048
function spawn2048(){
 let a=s.board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
 if(a.length)s.board[a[Math.floor(Math.random()*a.length)]]=Math.random()<.9?2:4;
}
function move2048(dx,dy){
 if(over)return;
 let dir=Math.abs(dx)>Math.abs(dy)
  ?(dx>0?"right":"left"):(dy>0?"down":"up");
 let old=s.board.slice(),b=old.slice();
 for(let i=0;i<4;i++){
  let a=[];
  for(let j=0;j<4;j++){
   let k=dir==="left"?i*4+j:
    dir==="right"?i*4+3-j:
    dir==="up"?j*4+i:(3-j)*4+i;
   a.push(b[k]);
  }
  a=a.filter(Boolean);
  for(let j=0;j<a.length-1;j++){
   if(a[j]===a[j+1]){
    a[j]*=2;add(a[j]);a.splice(j+1,1);
   }
  }
  while(a.length<4)a.push(0);
  for(let j=0;j<4;j++){
   let k=dir==="left"?i*4+j:
    dir==="right"?i*4+3-j:
    dir==="up"?j*4+i:(3-j)*4+i;
   b[k]=a[j];
  }
 }
 if(b.some((v,i)=>v!==old[i]))s.board=b,spawn2048();
}
function draw2048(){
 bg("#242038","#101321");
 let colors={2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
 for(let i=0;i<16;i++){
  let x=18+i%4*145,y=85+Math.floor(i/4)*150,v=s.board[i];
  rect(x,y,137,140,v?colors[v]||"#9563db":"#ffffff13",12);
  if(v)txt(v,x+68,y+84,37,v>=8?"white":"#584a42");
 }
 txt("2048",300,48,30);
}

// 7. MEMORY
function memory(x,y){
 let col=Math.floor((x-15)/145);
 let row=Math.floor((y-110)/145);
 let i=row*4+col;
 if(i<0||i>=16||s.open.length===2||
 s.matched.includes(i)||s.open.includes(i))return;
 s.open.push(i);
 if(s.open.length===2){
  s.moves++;
  if(s.cards[s.open[0]]===s.cards[s.open[1]]){
   s.matched.push(...s.open);s.open=[];add(10);
   if(s.matched.length===16)finish("همه کارت ها پیدا شدند!");
  }else{
   setTimeout(()=>{if(game===6&&s.open.length===2)s.open=[]},700);
  }
 }
}
function drawMemory(){
 bg("#151d3c","#0a1023");
 s.cards.forEach((v,i)=>{
  let x=15+i%4*145,y=110+Math.floor(i/4)*145;
  let show=s.open.includes(i)||s.matched.includes(i);
  rect(x,y,135,125,show?"#eee8ff":"#4655a4",12);
  txt(show?v:"?",x+67,y+80,show?42:48,show?"#30284b":"white");
 });
 txt("MOVES: "+s.moves,300,55,23);
}

// 8. SIMON
function beginSimon(){
 if(over)return;
 s.seq=[Math.floor(rand(0,4))];s.step=0;s.waiting=true;
 simonShow();
}
function simonShow(){
 if(game!==7||over)return;
 s.waiting=false;
 let i=0;
 function next(){
  if(game!==7||over)return;
  if(i>=s.seq.length){
   s.active=-1;s.step=0;s.waiting=true;
   $("bottom").textContent="ترتیب رنگ ها را لمس کن";
   return;
  }
  s.active=s.seq[i++];
  simonTimer=setTimeout(()=>{
   s.active=-1;
   simonTimer=setTimeout(next,180);
  },450);
 }
 next();
}
function simonClick(x,y){
 if(!s.waiting||over)return;
 let i=Math.floor(y/(H/2))*2+Math.floor(x/(W/2));
 if(i!==s.seq[s.step]){
  finish("اشتباه شد!");return;
 }
 s.step++;
 if(s.step===s.seq.length){
  add();
  s.waiting=false;
  simonTimer=setTimeout(()=>{
   if(game===7&&!over){
    s.seq.push(Math.floor(rand(0,4)));
    simonShow();
   }
  },600);
 }
}
function drawSimon(){
 bg("#14162e","#080d1b");
 let colors=["#ed5269","#44d88c","#438bff","#f3c34e"];
 for(let i=0;i<4;i++){
  let x=i%2*300+8,y=Math.floor(i/2)*330+8;
  rect(x,y,284,315,s.active===i?"white":colors[i],22);
  txt(["●","◆","▲","★"][i],x+142,y+185,85,"#ffffff");
 }
 txt("SIMON",300,685,22);
}

// 9. RUNNER
function jump(){
 if(!over&&s.y>=525)s.vy=-15;
}
function updateRunner(dt){
 s.vy+=.65*dt;s.y+=s.vy*dt;
 if(s.y>525){s.y=525;s.vy=0;}
 s.timer+=dt;
 if(s.timer>55){
  s.timer=0;s.obs.push({x:630,h:rand(50,110),passed:false});
 }
 s.obs.forEach(o=>{
  o.x-=7*dt;
  if(o.x<125&&o.x+40>85&&s.y+65>625-o.h)finish("به مانع برخورد کردی");
  if(!o.passed&&o.x<80){o.passed=true;add();}
 });
 s.obs=s.obs.filter(o=>o.x>-60);
}
function drawRunner(){
 bg("#58b9e8","#d1eaff");
 circle(500,90,40,"#fff1a0");
 for(let i=0;i<6;i++)circle(i*120+20,170,35,"#ffffff77");
 rect(0,625,600,75,"#4aaf58");
 s.obs.forEach(o=>rect(o.x,625-o.h,40,o.h,"#258b4a"));
 circle(105,s.y+20,22,"#ffb23f");
 rect(88,s.y+35,35,38,"#477cf6");
 rect(90,s.y+68,12,18,"#242e4b");
 rect(110,s.y+68,12,18,"#242e4b");
}

// 10. RACING
function changeLane(x){
 s.lane=Math.max(0,Math.min(2,Math.floor(x/200)));
}
function updateRacing(dt){
 s.timer+=dt;s.speed=Math.min(12,6+score*.08);
 if(s.timer>40){
  s.timer=0;s.obs.push({lane:Math.floor(rand(0,3)),y:-70,passed:false});
 }
 s.obs.forEach(o=>{
  o.y+=s.speed*dt;
  if(o.lane===s.lane&&o.y>555&&o.y<680)finish("تصادف کردی!");
  if(!o.passed&&o.y>700){o.passed=true;add();}
 });
 s.obs=s.obs.filter(o=>o.y<760);
}
function car(x,y,color){
 rect(x-23,y-35,46,72,color,12);
 rect(x-16,y-25,32,22,"#b9edff",6);
 rect(x-15,y+7,30,17,"#26334d",4);
 rect(x-28,y-22,7,17,"#111",3);
 rect(x+21,y-22,7,17,"#111",3);
}
function drawRacing(){
 bg("#27844e","#145234");
 rect(75,0,450,700,"#454a54");
 rect(90,0,5,700,"#f2dc5a");
 rect(505,0,5,700,"#f2dc5a");
 for(let i=0;i<2;i++){
  for(let y=-40;y<740;y+=100){
   rect(225+i*150,y+(s.timer*8)%100,5,45,"#ffffff88");
  }
 }
 s.obs.forEach(o=>car(150+o.lane*150,o.y,"#e84d65"));
 car(150+s.lane*150,590,"#36b9ff");
 txt("MINI RACING",300,45,23);
}

// ذرات تصویری
function particle(x,y,color){
 for(let i=0;i<12;i++)particles.push({
  x,y,vx:rand(-4,4),vy:rand(-4,4),life:30,color
 });
}
function updateParticles(){
 particles.forEach(p=>{
  p.x+=p.vx;p.y+=p.vy;p.life--;
 });
 particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
 particles.forEach(p=>{
  ctx.globalAlpha=p.life/30;
  circle(p.x,p.y,4,p.color);
 });
 ctx.globalAlpha=1;
}

function draw(){
 if(game===0)drawFlappy();
 if(game===1)drawSnake();
 if(game===2)drawPong();
 if(game===3)drawBreakout();
 if(game===4)drawTic();
 if(game===5)draw2048();
 if(game===6)drawMemory();
 if(game===7)drawSimon();
 if(game===8)drawRunner();
 if(game===9)drawRacing();

 drawParticles();

 if(over){
  ctx.fillStyle="#050817cc";
  ctx.fillRect(0,0,W,H);
  txt("GAME OVER",300,300,45);
  txt("امتیاز: "+score,300,365,30,"#ffe17b");
  txt("برای بازی دوباره 🔄 را بزن",300,420,21);
 }
}
