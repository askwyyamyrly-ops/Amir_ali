 
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AMIR ALI ARCADE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1b;color:white;font-family:Tahoma;touch-action:pan-y}
header{text-align:center;padding:22px;background:linear-gradient(130deg,#17245b,#542c86)}
header h1{margin:0;text-shadow:0 0 18px #9c8aff}
.wrap{max-width:1000px;margin:auto;padding:15px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{padding:15px;border-radius:18px;background:linear-gradient(140deg,#243568,#10182e);border:1px solid #475b91;cursor:pointer}
.card:active{transform:scale(.96)}
.card .emoji{font-size:38px}
.card h3{margin:8px 0}
.card p{color:#aebde5;font-size:12px}
#play{display:none;position:relative;text-align:center}
#play.full{
 position:fixed;inset:0;z-index:10;background:#070b18;
 display:flex;flex-direction:column;justify-content:center;
 padding:8px;
}
#play.full canvas{width:min(100%,900px);max-height:75vh}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:10px}
button{background:#6255ef;color:white;border:0;border-radius:12px;padding:11px 13px;font-family:inherit;font-weight:bold}
button:active{transform:scale(.94)}
canvas{width:100%;max-width:700px;background:#111c39;border:1px solid #5264a4;border-radius:15px;touch-action:none;display:block;margin:auto}
#controls{display:flex;justify-content:center;gap:10px;margin:10px}
#message{font-size:13px;color:#c5d0ff;min-height:20px}
footer{text-align:center;color:#7785aa;padding:25px}
@media(min-width:650px){.games{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>🎮 AMIR ALI ARCADE</h1><p>ULTIMATE 2D GAME WORLD</p></header>
<div class="wrap">
<section id="menu">
<h2>🔥 انتخاب بازی</h2>
<div class="games" id="games"></div>
</section>

<section id="play">
<div class="topbar">
<button onclick="home()">🏠 منو</button>
<strong id="title">GAME</strong>
<span id="score">0</span>
<button onclick="toggleFull()">⛶</button>
<button onclick="exitGame()">✖ خروج</button>
</div>
<canvas id="c" width="600" height="420"></canvas>
<div id="message"></div>
<div id="controls"></div>
</section>
</div>
<footer>AMIR ALI ARCADE © 2026</footer>

<script>
const $=id=>document.getElementById(id);
const c=$("c"),ctx=c.getContext("2d"),W=600,H=420;
const names=[
["🐦","Flappy Bird"],["🐍","Snake"],["🏓","Pong"],
["🧱","Breakout"],["❌","Tic Tac Toe"],["🔢","2048"],
["🧠","Memory Cards"],["🎵","Simon Game"],
["🏃","Jungle Runner"],["🏎️","Mini Racing"]
];
let game=0,s={},score=0,best={},running=false,over=false;
let raf=0,last=0,particles=[],touch={x:0,y:0};
let simonTimer=null;

names.forEach((g,i)=>{
 let d=document.createElement("div");d.className="card";
 d.innerHTML=`<div class="emoji">${g[0]}</div><h3>${g[1]}</h3><p>بازی دوبعدی حرفه‌ای</p>`;
 d.onclick=()=>start(i);$("games").appendChild(d);
});

function bg(a="#17284b",b="#080d1b"){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,a);g.addColorStop(1,b);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function box(x,y,w,h,color,r=6){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function ball(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function txt(t,x,y,size=24,color="white"){
 ctx.fillStyle=color;ctx.font=`bold ${size}px Tahoma`;
 ctx.textAlign="center";ctx.fillText(t,x,y);
}
function add(n=1){
 score+=n;best[game]=Math.max(score,best[game]||0);
 $("score").textContent="امتیاز: "+score+" | رکورد: "+best[game];
}
function finish(msg="بازی تمام شد"){
 if(over)return;over=true;
 $("message").textContent=msg+" | شروع دوباره را بزن";
}
function start(i){
 game=i;score=0;over=false;running=true;particles=[];
 $("menu").style.display="none";$("play").style.display="block";
 $("title").textContent=names[i][1];$("message").textContent="";
 $("score").textContent="امتیاز: 0";
 init();makeControls();
 last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function init(){
 s={};
 if(game===0)s={y:200,v:0,pipes:[],timer:0};
 if(game===1)s={body:[[10,10],[9,10],[8,10]],dir:[1,0],food:[18,10],timer:0};
 if(game===2)s={x:300,y:210,vx:4,vy:3,p:180,ai:180};
 if(game===3){
 s={x:300,ballX:300,ballY:320,vx:4,vy:-4,bricks:[]};
 for(let r=0;r<5;r++)for(let j=0;j<9;j++)
 s.bricks.push({x:32+j*60,y:35+r*28,on:true,color:["#ff526c","#ffb84b","#47c9f0","#a76cff","#55dc94"][r]});
 }
 if(game===4)s={board:Array(9).fill(""),turn:"X",done:false};
 if(game===5){s={board:Array(16).fill(0)};spawn();spawn();}
 if(game===6){
 let a=["🍎","🍎","🚗","🚗","⭐","⭐","🐱","🐱","⚽","⚽","🍀","🍀","🌙","🌙","🍒","🍒"];
 a.sort(()=>Math.random()-.5);s={cards:a,open:[],matched:[],moves:0};
 }
 if(game===7)s={seq:[],step:0,waiting:false,active:-1};
 if(game===8)s={y:320,vy:0,obs:[],timer:0};
 if(game===9)s={lane:1,obs:[],timer:0,speed:5};
}
function makeControls(){
 $("controls").innerHTML="";
 let labels=game===0?["پرش"]:game===1?["⬆","⬇","⬅","➡"]:
 [2,3].includes(game)?["⬅","➡"]:
 game===8?["پرش"]:game===9?["⬅","➡"]:[];
 labels.forEach(b=>{
 let el=document.createElement("button");el.textContent=b;
 el.onpointerdown=e=>{e.preventDefault();act(b)};
 $("controls").appendChild(el);
 });
 if(game===7){
 let el=document.createElement("button");el.textContent="شروع";
 el.onclick=beginSimon;$("controls").appendChild(el);
 }
}
function home(){
 stop();
 $("play").classList.remove("full");
 $("play").style.display="none";$("menu").style.display="block";
}
function exitGame(){
 if(confirm("از بازی خارج شوی؟"))home();
}
function stop(){
 running=false;cancelAnimationFrame(raf);
 if(simonTimer)clearTimeout(simonTimer);
}
async function toggleFull(){
 let p=$("play");
 try{
 if(!document.fullscreenElement){
 await p.requestFullscreen();
 p.classList.add("full");
 }else{
 await document.exitFullscreen();
 p.classList.remove("full");
 }
 }catch(e){
 p.classList.toggle("full");
 }
}
document.addEventListener("fullscreenchange",()=>{
 if(!document.fullscreenElement)$("play").classList.remove("full");
});
function restart(){
 over=false;score=0;particles=[];init();
 $("message").textContent="";$("score").textContent="امتیاز: 0";
}
function act(b){
 if(over)return;
 if(game===0||game===8){s.vy=-11.5;s.v=-7;}
 if(game===1){
 let d={"⬆":[0,-1],"⬇":[0,1],"⬅":[-1,0],"➡":[1,0]}[b];
 if(d&&d[0]!==-s.dir[0]&&d[1]!==-s.dir[1])s.dir=d;
 }
 if(game===2){if(b==="⬆")s.p-=30;if(b==="⬇")s.p+=30;}
 if(game===3){if(b==="⬅")s.x-=40;if(b==="➡")s.x+=40;}
 if(game===9){if(b==="⬅")s.lane=Math.max(0,s.lane-1);if(b==="➡")s.lane=Math.min(2,s.lane+1);}
}
window.addEventListener("keydown",e=>{
 if(e.key==="Escape")return;
 if(e.key==="ArrowUp"||e.key===" ")act("پرش");
 if(e.key==="ArrowDown")act("⬇");
 if(e.key==="ArrowLeft")act("⬅");
 if(e.key==="ArrowRight")act("➡");
});
function point(e){
 let r=c.getBoundingClientRect();
 return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
c.addEventListener("pointerdown",e=>{
 if(over)return;
 let p=point(e);touch.x=p.x;touch.y=p.y;
 if(game===0){act("پرش");return;}
 if(game===2){s.p=p.y-40;return;}
 if(game===3){s.x=p.x;return;}
 if(game===4)tic(p.x,p.y);
 if(game===5)swipe2048(p.x,p.y);
 if(game===6)memory(p.x,p.y);
 if(game===7)simonClick(Math.floor(p.y/210)*2+Math.floor(p.x/300));
 if(game===8){act("پرش");return;}
 if(game===9){
 s.lane=p.x<200?0:p.x<400?1:2;
 }
});
c.addEventListener("pointermove",e=>{
 if(e.buttons!==1||over)return;
 let p=point(e);
 if(game===2)s.p=p.y-40;
 if(game===3)s.x=p.x;
 if(game===9)s.lane=p.x<200?0:p.x<400?1:2;
});
c.addEventListener("pointerup",e=>{
 if(game!==1||over)return;
 let p=point(e),dx=p.x-touch.x,dy=p.y-touch.y;
 if(Math.abs(dx)+Math.abs(dy)<20)return;
 let d=Math.abs(dx)>Math.abs(dy)?(dx>0?[1,0]:[-1,0]):(dy>0?[0,1]:[0,-1]);
 if(d[0]!==-s.dir[0]||d[1]!==-s.dir[1])s.dir=d;
});
function loop(t){
 if(!running)return;
 let dt=Math.min((t-last)/16.67||1,2);last=t;
 if(!over)update(dt);
 draw();
 raf=requestAnimationFrame(loop);
}
function update(dt){
 if(game===0)flappy(dt);
 if(game===1)snake(dt);
 if(game===2)pong(dt);
 if(game===3)breakout(dt);
 if(game===8)runner(dt);
 if(game===9)racing(dt);
}
function flappy(dt){
 s.timer+=dt;s.v+=.42*dt;s.y+=s.v*dt;
 if(s.timer>90){s.timer=0;let top=rand(40,220),gap=155;s.pipes.push({x:620,top,gap,done:false});}
 s.pipes.forEach(p=>{
 p.x-=3.5*dt;
 if(!p.done&&p.x<100){p.done=true;add();}
 if(117>p.x&&83<p.x+65&&(s.y<p.top||s.y>p.top+p.gap))finish();
 });
 s.pipes=s.pipes.filter(p=>p.x>-70);
 if(s.y<0||s.y>390)finish();
}
function drawFlappy(){
 bg("#42a9e8","#b5e9ff");ball(510,65,34,"#fff1a5");
 s.pipes.forEach(p=>{
 box(p.x,0,65,p.top,"#20b94c");
 box(p.x-5,p.top-18,75,18,"#39e56a");
 box(p.x,p.top+p.gap,65,420,"#20b94c");
 box(p.x-5,p.top+p.gap,75,18,"#39e56a");
 });
 box(0,385,600,35,"#54b64e");
 ball(100,s.y,16,"#ffdc36");ball(105,s.y-5,5,"white");
 box(110,s.y,18,7,"#ff8d30",3);
}
function snake(dt){
 s.timer+=dt;if(s.timer<7)return;s.timer=0;
 let h=s.body[0],n=[h[0]+s.dir[0],h[1]+s.dir[1]];
 if(n[0]<0||n[0]>=30||n[1]<0||n[1]>=21||s.body.some(p=>p[0]===n[0]&&p[1]===n[1])){finish();return;}
 s.body.unshift(n);
 if(n[0]===s.food[0]&&n[1]===s.food[1]){add(10);s.food=[Math.floor(rand(1,29)),Math.floor(rand(1,20))];}
 else s.body.pop();
}
function drawSnake(){
 bg("#071c24","#091321");
 ball(s.food[0]*20+10,s.food[1]*20+10,8,"#ff526b");
 s.body.forEach((p,i)=>box(p[0]*20+2,p[1]*20+2,16,16,i?"#28cf8c":"#a7ff66",5));
}
function pong(dt){
 s.y+=s.vy*dt;s.x+=s.vx*dt;
 if(s.y<10||s.y>410)s.vy*=-1;
 s.ai+=(s.y-s.ai)*.05*dt;
 s.p=Math.max(0,Math.min(340,s.p));
 if(s.x<40&&s.y>s.p&&s.y<s.p+80){s.vx=Math.abs(s.vx)*1.06;s.vy+=(s.y-s.p-40)*.08;}
 if(s.x>560&&s.y>s.ai&&s.y<s.ai+80)s.vx=-Math.abs(s.vx);
 if(s.x<0)finish("حریف برنده شد");
 if(s.x>600){add();s.x=300;s.vx=-4;}
}
function drawPong(){
 bg("#111a39","#080d1c");
 for(let y=0;y<420;y+=35)box(298,y,4,18,"#ffffff44");
 box(20,s.p,13,80,"#51e4ff");
 box(567,s.ai,13,80,"#ff70b5");
 ball(s.x,s.y,10,"white");
}
function breakout(dt){
 s.x=Math.max(50,Math.min(550,s.x));
 s.bx??=300;s.by??=320;
 s.bx+=s.vx*dt;s.by+=s.vy*dt;
 if(s.bx<10||s.bx>590)s.vx*=-1;
 if(s.by<10)s.vy=Math.abs(s.vy);
 if(s.by>365&&s.bx>s.x-55&&s.bx<s.x+55){s.vy=-Math.abs(s.vy);s.vx+=(s.bx-s.x)*.08;}
 if(s.by>420){finish();return;}
 s.bricks.forEach(b=>{
 if(b.on&&s.bx>b.x&&s.bx<b.x+55&&s.by>b.y&&s.by<b.y+22){b.on=false;s.vy*=-1;add(5);}
 });
 if(s.bricks.every(b=>!b.on))finish("برنده شدی");
}
function drawBreakout(){
 bg("#17122d","#080d1b");
 s.bricks.forEach(b=>{if(b.on)box(b.x,b.y,54,20,b.color);});
 box(s.x-52,375,104,13,"#61ddff",8);
 ball(s.bx??300,s.by??320,9,"#fff17a");
}
function tic(x,y){
 if(s.done)return;
 let i=Math.floor(y/140)*3+Math.floor(x/200);
 if(i<0||i>8||s.board[i])return;
 s.board[i]=s.turn;
 let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 if(lines.some(a=>a.every(k=>s.board[k]===s.turn))){s.done=true;finish(s.turn+" برنده شد!");return;}
 if(s.board.every(Boolean)){s.done=true;finish("مساوی");return;}
 s.turn=s.turn==="X"?"O":"X";
}
function drawTic(){
 bg("#171533","#080d1b");
 for(let i=1;i<3;i++){box(i*200-2,30,4,360,"#7784bc");box(30,i*130+5,540,4,"#7784bc");}
 s.board.forEach((v,i)=>{
 let x=i%3*200+100,y=Math.floor(i/3)*130+90;
 if(v==="X")txt("X",x,y+20,75,"#ff7197");
 if(v==="O"){ctx.strokeStyle="#65dcff";ctx.lineWidth=9;ctx.beginPath();ctx.arc(x,y,32,0,7);ctx.stroke();}
 });
}
function spawn(){
 let a=s.board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
 if(a.length)s.board[a[Math.floor(Math.random()*a.length)]]=Math.random()<.9?2:4;
}
function swipe2048(x,y){
 let d=Math.abs(x-300)>Math.abs(y-210)?(x>300?"right":"left"):(y>210?"down":"up");
 let old=s.board.slice(),b=old.slice();
 for(let i=0;i<4;i++){
 let a=[];
 for(let j=0;j<4;j++){
 let k=d==="left"?i*4+j:d==="right"?i*4+3-j:d==="up"?j*4+i:(3-j)*4+i;
 a.push(b[k]);
 }
 a=a.filter(Boolean);
 for(let j=0;j<a.length-1;j++)if(a[j]===a[j+1]){a[j]*=2;add(a[j]);a.splice(j+1,1);}
 while(a.length<4)a.push(0);
 for(let j=0;j<4;j++){
 let k=d==="left"?i*4+j:d==="right"?i*4+3-j:d==="up"?j*4+i:(3-j)*4+i;b[k]=a[j];
 }
 }
 if(b.some((v,i)=>v!==old[i])){s.board=b;spawn();}
}
function draw2048(){
 bg("#252036","#101321");
 let colors={2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
 s.board.forEach((v,i)=>{
 let x=30+i%4*137,y=25+Math.floor(i/4)*96;
 box(x,y,125,84,v?colors[v]||"#9865d9":"#ffffff14",9);
 if(v)txt(v,x+62,y+53,30,v>=8?"white":"#584a42");
 });
}
function memory(x,y){
 let i=Math.floor((y-35)/90)*4+Math.floor((x-30)/137);
 if(i<0||i>=16||s.open.length===2||s.matched.includes(i)||s.open.includes(i))return;
 s.open.push(i);
 if(s.open.length===2){
 s.moves++;
 if(s.cards[s.open[0]]===s.cards[s.open[1]]){
 s.matched.push(...s.open);s.open=[];add(10);
 if(s.matched.length===16)finish("همه کارت ها پیدا شدند!");
 }else setTimeout(()=>{if(game===6&&s.open.length===2)s.open=[];},700);
 }
}
function drawMemory(){
 bg("#151d3c","#0a1023");
 s.cards.forEach((v,i)=>{
 let x=30+i%4*137,y=35+Math.floor(i/4)*90;
 let show=s.open.includes(i)||s.matched.includes(i);
 box(x,y,125,78,show?"#eee8ff":"#4655a4",10);
 txt(show?v:"?",x+62,y+53,show?32:35,show?"#30284b":"white");
 });
 txt("MOVES "+s.moves,300,410,18);
}
function beginSimon(){
 s.seq=[Math.floor(rand(0,4))];s.step=0;s.waiting=true;
 $("message").textContent="رنگ‌ها را به خاطر بسپار!";
}
function simonClick(i){
 if(!s.waiting||s.active!==-1)return;
 s.active=i;simonTimer=setTimeout(()=>{if(game===7)s.active=-1;},250);
 if(i!==s.seq[s.step]){s.waiting=false;finish("اشتباه شد");return;}
 s.step++;
 if(s.step===s.seq.length){
 add();s.waiting=false;
 simonTimer=setTimeout(()=>{
 if(game===7&&!over){s.seq.push(Math.floor(rand(0,4)));s.step=0;s.waiting=true;}
 },700);
 }
}
function drawSimon(){
 bg("#14162e","#080d1b");
 let a=["#ed5269","#44d88c","#438bff","#f3c34e"];
 for(let i=0;i<4;i++){let x=i%2*290+10,y=Math.floor(i/2)*195+10;box(x,y,280,185,s.active===i?"white":a[i],20);txt("★",x+140,y+110,55);}
}
function runner(dt){
 s.vy+=.65*dt;s.y+=s.vy*dt;
 if(s.y>320){s.y=320;s.vy=0;}
 s.timer+=dt;
 if(s.timer>55){s.timer=0;s.obs.push({x:620,h:rand(40,80),passed:false});}
 s.obs.forEach(o=>{
 o.x-=6*dt;
 if(o.x<120&&o.x+35>85&&s.y+45>350-o.h)finish();
 if(!o.passed&&o.x<80){o.passed=true;add();}
 });
 s.obs=s.obs.filter(o=>o.x>-50);
}
function drawRunner(){
 bg("#58b9e8","#d1eaff");ball(500,70,35,"#fff1a0");
 box(0,350,600,70,"#4aaf58");
 s.obs.forEach(o=>box(o.x,350-o.h,35,o.h,"#258b4a"));
 ball(100,s.y+15,19,"#ffb23f");
 box(85,s.y+25,30,27,"#477cf6");
 box(88,s.y+48,9,12,"#242e4b");box(106,s.y+48,9,12,"#242e4b");
}
function racing(dt){
 s.timer+=dt;s.speed=Math.min(10,5+score*.08);
 if(s.timer>40){s.timer=0;s.obs.push({lane:Math.floor(rand(0,3)),y:-60,passed:false});}
 s.obs.forEach(o=>{
 o.y+=s.speed*dt;
 if(o.lane===s.lane&&o.y>310&&o.y<390)finish("تصادف کردی!");
 if(!o.passed&&o.y>410){o.passed=true;add();}
 });
 s.obs=s.obs.filter(o=>o.y<470);
}
function car(x,y,color){
 box(x-19,y-28,38,57,color,9);
 box(x-13,y-19,26,16,"#b9edff",5);
 box(x-13,y+5,26,12,"#26334d",3);
 box(x-24,y-17,7,15,"#111",2);box(x+17,y-17,7,15,"#111",2);
}
function drawRacing(){
 bg("#27844e","#145234");box(90,0,420,420,"#454a54");
 for(let i=0;i<2;i++)for(let y=-30;y<450;y+=75)box(235+i*130,y+(s.timer*5)%75,5,35,"#ffffff88");
 box(95,0,7,420,"#f2dc5a");box(498,0,7,420,"#f2dc5a");
 s.obs.forEach(o=>car(170+o.lane*130,o.y,"#e84d65"));
 car(170+s.lane*130,350,"#36b9ff");
}
function draw(){
 if(game===0)drawFlappy();
 if(game===1)drawSnake();
 if(game===2)drawPong();
